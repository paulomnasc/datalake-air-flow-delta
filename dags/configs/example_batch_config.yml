# Exemplo de configuração YAML para processamento batch
# Este arquivo é gerado automaticamente pela WebApp quando múltiplos arquivos são enviados

# Identificação
dag_id: dag_vendas_batch
batch_id: batch_67890abc123def
batch_mode: parallel  # ou 'sequential'
max_parallel_tasks: 4

# Metadata
total_files: 3
created_at: '2025-12-20 14:30:22'

# Lista de arquivos a processar
files:
  - source_path: raw/dag_vendas/20251220143022_vendas_janeiro.csv
    file_name: vendas_janeiro.csv
    size_bytes: 524288
  
  - source_path: raw/dag_vendas/20251220143022_vendas_fevereiro.csv
    file_name: vendas_fevereiro.csv
    size_bytes: 612352
  
  - source_path: raw/dag_vendas/20251220143022_vendas_marco.csv
    file_name: vendas_marco.csv
    size_bytes: 458752

# Função do pipeline a ser executada
pipeline_function: lib.medallion_pipeline.batch_raw_to_medallion

# Configurações adicionais (opcional)
owner: airflow
email_on_failure: false
retries: 1
retry_delay_minutes: 5

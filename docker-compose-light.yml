version: '3.8'

services:
  nginx-light:
    image: nginx:alpine
    container_name: nginx-light
    restart: always
    ports:
      - "8080:8080"
      - "8443:8443"
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/myflow.conf.template:/etc/nginx/templates/myflow.conf.template:ro
      - ./nginx/myflow-ssl.conf.template:/etc/nginx/templates/myflow-ssl.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx_logs_light:/var/log/nginx
    environment:
      - NGINX_PORT_HTTP=8080
      - NGINX_PORT_HTTPS=8443
      - NGINX_SERVER_NAME=localhost
      - NGINX_SSL_CERT=/etc/letsencrypt/live/localhost/fullchain.pem
      - NGINX_SSL_KEY=/etc/letsencrypt/live/localhost/privkey.pem
    depends_on:
      - codeigniter-light
      - mysql-light
    networks:
      - light_net

  codeigniter-light:
    image: php:8.2-apache
    container_name: codeigniter-light
    volumes:
      - ./src/codeigniter-app:/var/www/html
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    networks:
      - light_net

  mysql-light:
    image: mysql:8.0
    container_name: mysql-light
    environment:
      - MYSQL_ROOT_PASSWORD=lightpass
      - MYSQL_DATABASE=lightdb
      - MYSQL_USER=lightuser
      - MYSQL_PASSWORD=lightpass
    ports:
      - "33060:3306"
    volumes:
      - mysql_data_light:/var/lib/mysql
    networks:
      - light_net

volumes:
  nginx_logs_light:
  mysql_data_light:

networks:
  light_net:
    driver: bridge

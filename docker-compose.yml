
version: '3.8'

services:

  # 🌐 Nginx Reverse Proxy (Gateway para webapp)
  nginx:
    image: nginx:alpine
    container_name: nginx-gateway${ENV_SUFFIX:+-${ENV_SUFFIX}}
    restart: always
    ports:
      - "${NGINX_PORT_HTTP}:${NGINX_PORT_HTTP}"
      - "${NGINX_PORT_HTTPS}:${NGINX_PORT_HTTPS}"
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/myflow.conf.template:/etc/nginx/templates/myflow.conf.template:ro
      - ./nginx/error-pages:/etc/nginx/error-pages:ro
      - ./landing-page:/usr/share/nginx/html/landing-page:ro
      # SSL template (apenas para produção - comentar em dev)
      - ./nginx/myflow-ssl.conf.template:/etc/nginx/templates/myflow-ssl.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    environment:
      - NGINX_PORT_HTTP=${NGINX_PORT_HTTP}
      - NGINX_PORT_HTTPS=${NGINX_PORT_HTTPS}
      - NGINX_SERVER_NAME=${NGINX_SERVER_NAME:-localhost}
      - NGINX_SSL_CERT=${NGINX_SSL_CERT}
      - NGINX_SSL_KEY=${NGINX_SSL_KEY}
      - AIRFLOW_WEBSERVER_PORT=${AIRFLOW_WEBSERVER_PORT}
    depends_on:
      - codeigniter-app
      - airflow-webserver
    networks:
      - airflow_net

  spark:
    image: apache/spark:3.4.1
    container_name: spark${ENV_SUFFIX:+-${ENV_SUFFIX}}
    #build:
    #  context: .
    #  dockerfile: Dockerfile.spark
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "${SPARK_PORT_RPC}:7077"
      - "${SPARK_PORT_WEB}:8080"
    volumes:
      - ./spark-apps:/opt/spark-apps
    #   - ./jars:/opt/spark/jars
    #   - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "vscode:host-gateway"
    networks:
      - airflow_net

  spark-worker:
    image: apache/spark:3.4.1
    container_name: spark-worker${ENV_SUFFIX:+-${ENV_SUFFIX}}
    depends_on:
      - spark
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark:7077"]
    environment:
      - SPARK_MODE=worker
      # Use as coordenadas Maven dos seus jars
      - SPARK_OPTS=--packages io.delta:delta-core_2.12:2.4.0,org.apache.hadoop:hadoop-aws:3.3.4
    ports:
      - "${SPARK_WORKER_PORT}:8081"
    volumes:
      - spark_ivy:/home/spark/.ivy2
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "vscode:host-gateway"
    networks:
      - airflow_net

  postgres:
    image: postgres:13
    container_name: postgres${ENV_SUFFIX:+-${ENV_SUFFIX}}
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "vscode:host-gateway"
    networks:
      - airflow_net

  postgres-bi:
    image: postgres:13
    container_name: postgres-bi${ENV_SUFFIX:+-${ENV_SUFFIX}}
    environment:
      POSTGRES_USER: pbi_user
      POSTGRES_PASSWORD: pbi_password
      POSTGRES_DB: datalake_bi
    ports:
      - "${POSTGRES_BI_PORT}:5432"
    volumes:
      - pg_bi_data:/var/lib/postgresql/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "vscode:host-gateway"
    networks:
      - airflow_net

  redis:
    image: redis:7
    container_name: redis${ENV_SUFFIX:+-${ENV_SUFFIX}}
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "vscode:host-gateway"
    networks:
      - airflow_net

  mysql:
    image: mysql:8.0
    container_name: mysql${ENV_SUFFIX:+-${ENV_SUFFIX}}
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
    # 🚨 CRÍTICO: Mapeia sua pasta local de scripts para o diretório de inicialização do Docker
      - ./mysql-init:/docker-entrypoint-initdb.d 
      # Volume de dados para persistir o DB (crucial para o initdb.d rodar apenas na primeira vez)
      - mysql_data:/var/lib/mysql
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "vscode:host-gateway"
    networks:
      - airflow_net

  airflow-webserver:
    build: .
    container_name: airflow-webserver${ENV_SUFFIX:+-${ENV_SUFFIX}}
    restart: always
    depends_on:
      - postgres
    environment:
      - ENV_SUFFIX=${ENV_SUFFIX:-dev}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__WEB_SERVER_PORT=8080
      - AIRFLOW__WEBSERVER__BASE_URL=http://localhost:8080
      - AIRFLOW__WEBSERVER__SECRET_KEY=AjF/meBAL8/pgnArFvuNKw==
      - AIRFLOW__WEBSERVER__FILTER_BY_OWNER=True
      - AIRFLOW__WEBSERVER__OWNER_MODE=user
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
      - MINIO_BUCKET=lab01
      - ENABLE_ATLAS=false
    volumes:
      - ./src/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/usr/local/bin/scripts:ro
      - ./ddb:/opt/duckdb
    ports:
      - "${AIRFLOW_WEBSERVER_PORT}:8080"
    command: airflow webserver
    user: root
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "vscode:host-gateway"
    networks:
      - airflow_net

  airflow-scheduler:
    build: .
    container_name: airflow-scheduler${ENV_SUFFIX:+-${ENV_SUFFIX}}
    restart: always
    depends_on:
      - postgres
      - atlas
    environment:
      - ENV_SUFFIX=${ENV_SUFFIX:-dev}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=AjF/meBAL8/pgnArFvuNKw==
      - AIRFLOW__WEBSERVER__FILTER_BY_OWNER=True
      - AIRFLOW__WEBSERVER__OWNER_MODE=user
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
      - MINIO_BUCKET=lab01
      - ENABLE_DEBUGPY=false
      - ENABLE_ATLAS=false
      - ATLAS_HOST=http://apache-atlas:21000
      - ATLAS_USER=admin
      - ATLAS_PASS=admin
      - ATLAS_HIVE_DB=medallion
      - ATLAS_REGISTER_PROCESSES=true
      - ATLAS_HTTP_TIMEOUT=120
      - ATLAS_MAX_RETRIES=5
      - ATLAS_BACKOFF_SECONDS=3
    volumes:
      - ./src/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/usr/local/bin/scripts:ro
      - ./ddb:/opt/duckdb
    ports:
      - "${AIRFLOW_SCHEDULER_DEBUG_PORT}:5678"
    command: airflow scheduler
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "vscode:host-gateway"
    networks:
      - airflow_net

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - /var/oled/minio_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "vscode:host-gateway"
    networks:
      - airflow_net

  # 🦆 DuckDB Query API (SQL sobre Parquet no MinIO)
  duckdb-api:
    build:
      context: ./duckdb-api
      dockerfile: Dockerfile
    container_name: duckdb-api${ENV_SUFFIX:+-${ENV_SUFFIX}}
    restart: always
    depends_on:
      - minio
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_REGION=us-east-1
      - MINIO_ACCESS_KEY_ID=admin
      - MINIO_SECRET_ACCESS_KEY=admin123
      - MINIO_BUCKET_RAW=lab01
      - DUCKDB_PATH=/opt/duckdb/datalake.duckdb
    volumes:
      - ./ddb:/opt/duckdb
    ports:
      - "${DUCKDB_API_PORT}:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "vscode:host-gateway"
    networks:
      - airflow_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 👷 AIRFLOW WORKER (Onde a DAG é executada)
  airflow-worker:
    image: apache/airflow:2.9.1
    depends_on:
      - airflow-webserver
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      ENABLE_ATLAS: "false"
    volumes:
      - ./src/dags:/opt/airflow/dags
      - ./scripts:/usr/local/bin/scripts:ro
      - ./ddb:/opt/duckdb
    command: ["airflow", "celery", "worker"]
    networks:
      - airflow_net

  # spark-sql:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.spark
  #   container_name: spark-sql
  #   depends_on:
  #     - spark
  #   command: [
  #     "bash",
  #     "-c",
  #     "/opt/spark-apps/start-thriftserver.sh"
  #   ]
  #   environment:
  #     - SPARK_HOME=/opt/spark
  #     - SPARK_MASTER_HOST=spark
  #     - AWS_ACCESS_KEY_ID=admin
  #     - AWS_SECRET_ACCESS_KEY=admin123
  #     - SPARK_CONF_DIR=/opt/spark/conf
  #   ports:
  #     - "10000:10000"
  #     - "10001:10001"
  #   volumes:
  #     - ./spark-conf:/opt/spark/conf
  #     - spark_ivy:/home/spark/.ivy2
  #   networks:
  #     - airflow_net

  # Adicione este bloco no seu docker-compose.yml
  # Novo Bloco do Serviço no docker-compose.yml
  codeigniter-app:
    build:
      context: ./src/codeigniter-app
      dockerfile: Dockerfile.webapp # Agora usará o Dockerfile que criamos
      args:
        # Passa as variáveis para o Dockerfile
        HOST_UID: ${UID:-1000} 
        HOST_GID: ${GID:-1000}
        DOCKER_GID: 1001  # GID do grupo docker no host
    container_name: codeigniter-app${ENV_SUFFIX:+-${ENV_SUFFIX}}
    restart: always
    depends_on:
      - mysql
    volumes:
      # Mapeamento do código completo (sem read-only para permitir writable)
      - ./src/codeigniter-app:/var/www/html
      # Mapeamento da raiz do projeto para acessar sync script (read-write para salvar validadores)
      - .:/datalake-root
      # Mapeamento do Docker socket para permitir docker commands
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${CODEIGNITER_PORT}:80"
      - "${CODEIGNITER_XDEBUG_PORT}:9003" # <--- Porta do XDebug
    environment:
      - CI_ENVIRONMENT=development
      # Porta externa do CodeIgniter (para construir app_baseURL)
      - CODEIGNITER_PORT=${CODEIGNITER_PORT}
      - NGINX_PORT_HTTP=${NGINX_PORT_HTTP}
      - NGINX_PORT_HTTPS=${NGINX_PORT_HTTPS}
      - NGINX_SERVER_NAME=${NGINX_SERVER_NAME:-localhost}
      - ENV_SUFFIX=${ENV_SUFFIX:-}
      # MinIO configuration used by the webapp (read by ConfigController::_initMinioClient())
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_REGION=us-east-1
      - MINIO_VERSION=latest
      - MINIO_USE_PATH_STYLE_ENDPOINT=true
      - MINIO_ACCESS_KEY_ID=admin
      - MINIO_SECRET_ACCESS_KEY=admin123
      - MINIO_BUCKET_RAW=lab01
      # Airflow external URL for menu link
      - AIRFLOW_EXTERNAL_URL=http://${NGINX_SERVER_NAME}:${AIRFLOW_WEBSERVER_PORT}
      # Airflow internal connection (API sync)
      - AIRFLOW_HOST=airflow-webserver${ENV_SUFFIX:+-${ENV_SUFFIX}}
      - AIRFLOW_PORT=8080
      - AIRFLOW_ADMIN_USERNAME=admin
      - AIRFLOW_ADMIN_PASSWORD=admin
      # ... (demais variáveis de ambiente)
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "vscode:host-gateway"
    networks:
      - airflow_net
    # Não precisa de 'command' se estiver usando imagem base PHP-Apache

  atlas:
    image: sburn/apache-atlas:latest
    container_name: apache-atlas${ENV_SUFFIX:+-${ENV_SUFFIX}}
    ports:
      - "${ATLAS_PORT}:21000"
    environment:
      - JAVA_OPTS=-Xmx1024m -Xms512m
      - ATLAS_SERVER_OPTS=-server -XX:SoftRefLRUPolicyMSPerMB=0 -XX:+CMSClassUnloadingEnabled -XX:+UseConcMarkSweepGC -XX:+CMSPermGenSweepingEnabled
    volumes:
      - atlas_data:/opt/atlas/data
      - atlas_logs:/opt/atlas/logs
    restart: unless-stopped
    mem_limit: 2g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - airflow_net

  pyspark-aula:
    build:
      context: ./atlas-lab
      dockerfile: Dockerfile_Spark
    container_name: pyspark-aula${ENV_SUFFIX:+-${ENV_SUFFIX}}
    profiles:
      - atlas
    ports:
      - "${JUPYTER_PORT}:8888" # Jupyter Notebook
      - "${SPARK_UI_PORT}:4040" # Spark UI
    volumes:
      - ./atlas-lab/notebooks:/home/jovyan/work
      - ./atlas-lab/data:/home/jovyan/data
      - ./atlas-lab/lab:/home/jovyan/lab
      - ./atlas-lab/meu-catalogo-atlas:/home/jovyan/meu-catalogo-atlas
    environment:
      - JUPYTER_TOKEN=tavares1234
      - SPARK_DRIVER_MEMORY=4g
      - SPARK_EXECUTOR_MEMORY=4g
    restart: always
    networks:
      - airflow_net
  

networks:
  airflow_net:
    driver: bridge

volumes:
  pg_data:
  pg_bi_data:
  mysql_data:
  atlas_data:
  atlas_logs:
  spark_metastore:
  spark_warehouse:
  spark_ivy:
  webapp_writable:
  nginx_logs:
  webapp_vendor:
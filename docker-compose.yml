
version: '3.8'

services:

  spark:
    image: apache/spark:3.5.1
    container_name: spark
    #build:
    #  context: .
    #  dockerfile: Dockerfile.spark
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./spark-apps:/opt/spark-apps
    #   - ./jars:/opt/spark/jars
    #   - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "vscode:host-gateway"
    networks:
      - airflow_net

  spark-worker:
    image: apache/spark:3.5.1
    container_name: spark-worker
    depends_on:
      - spark
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark:7077"]
    environment:
      - SPARK_MODE=worker
      # Use as coordenadas Maven dos seus jars
      - SPARK_OPTS=--packages io.delta:delta-core_2.12:2.4.0,org.apache.hadoop:hadoop-aws:3.3.2
    ports:
      - "8081:8081"
    volumes:
      - spark_ivy:/home/spark/.ivy2
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "vscode:host-gateway"
    networks:
      - airflow_net

  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "vscode:host-gateway"
    networks:
      - airflow_net

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "vscode:host-gateway"
    networks:
      - airflow_net

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lista_revisao
    ports:
      - "3306:3306"
    volumes:
    # 🚨 CRÍTICO: Mapeia sua pasta local de scripts para o diretório de inicialização do Docker
      - ./mysql-init:/docker-entrypoint-initdb.d 
      # Volume de dados para persistir o DB (crucial para o initdb.d rodar apenas na primeira vez)
      - mysql_data:/var/lib/mysql
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "vscode:host-gateway"
    networks:
      - airflow_net

  airflow-webserver:
    build: .
    container_name: airflow-webserver
    restart: always
    depends_on:
      - postgres
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__WEB_SERVER_PORT=8080
      - AIRFLOW__WEBSERVER__BASE_URL=http://localhost:8080
      - AIRFLOW__WEBSERVER__SECRET_KEY=AjF/meBAL8/pgnArFvuNKw==
      - MINIO_BUCKET=lab01
      - ENABLE_ATLAS=false
    volumes:
      - ./src/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/usr/local/bin/scripts:ro
    ports:
      - "8085:8080"
    command: airflow webserver
    user: root
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "vscode:host-gateway"
    networks:
      - airflow_net

  airflow-scheduler:
    build: .
    container_name: airflow-scheduler
    restart: always
    depends_on:
      - postgres
      - atlas
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=AjF/meBAL8/pgnArFvuNKw==
      - MINIO_BUCKET=lab01
      - ENABLE_DEBUGPY=false
      - ENABLE_ATLAS=false
      - ATLAS_HOST=http://apache-atlas:21000
      - ATLAS_USER=admin
      - ATLAS_PASS=admin
      - ATLAS_HIVE_DB=medallion
      - ATLAS_REGISTER_PROCESSES=true
      - ATLAS_HTTP_TIMEOUT=120
      - ATLAS_MAX_RETRIES=5
      - ATLAS_BACKOFF_SECONDS=3
    volumes:
      - ./src/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/usr/local/bin/scripts:ro
    ports:
      - "5678:5678"
    command: airflow scheduler
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "vscode:host-gateway"
    networks:
      - airflow_net

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - /var/oled/minio_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "vscode:host-gateway"
    networks:
      - airflow_net


  # 👷 AIRFLOW WORKER (Onde a DAG é executada)
  airflow-worker:
    image: apache/airflow:2.9.1
    depends_on:
      - airflow-webserver
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      ENABLE_ATLAS: "false"
    volumes:
      - ./src/dags:/opt/airflow/dags
      - ./scripts:/usr/local/bin/scripts:ro
    command: ["airflow", "celery", "worker"]
    networks:
      - airflow_net

  spark-sql:
    build:
      context: .
      dockerfile: Dockerfile.spark # Deve conter o Spark e os jars do Delta
    container_name: spark-sql
    depends_on:
      - spark # Depende do Master para se conectar
    command: ["/opt/spark-apps/start-thriftserver.sh"]
    environment:
      - SPARK_HOME=/opt/spark
      - SPARK_MASTER_HOST=spark
      # O Spark precisa de acesso ao MinIO para ler os dados Delta
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=admin123
      - SPARK_CONF_DIR=/opt/spark/conf
    ports:
      - "10000:10000" # Porta padrão do Thrift Server para ODBC/JDBC
      - "10001:10001" # Porta HTTP opcional
    volumes:
      # Monta o conf para o Spark
      - ./spark-conf:/opt/spark/conf
      # Volume para metastore (persistência)
      - spark_metastore:/home/spark/metastore_db
      - spark_warehouse:/home/spark/warehouse
      # Volume compartilhado para JARs do Ivy (Delta Lake)
      - spark_ivy:/home/spark/.ivy2
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "vscode:host-gateway"
    networks:
      - airflow_net

  # Adicione este bloco no seu docker-compose.yml
  # Novo Bloco do Serviço no docker-compose.yml
  codeigniter-app:
    build:
      context: ./src/codeigniter-app
      dockerfile: Dockerfile.webapp # Agora usará o Dockerfile que criamos
      args:
        # Passa as variáveis para o Dockerfile
        HOST_UID: ${UID:-1000} 
        HOST_GID: ${GID:-1000}
    container_name: codeigniter-app
    restart: always
    depends_on:
      - mysql
    volumes:
      # Mapeamento do código (para desenvolvimento local)
      - ./src/codeigniter-app:/var/www/html
      # Mapeamento para escrita dos YAMLs do Airflow
      - ./src/dags/configs:/var/www/html/writable/configs
      - /var/www/html/vendor
    ports:
      - "8088:80"
      - "9003:9003" # <--- Porta do XDebug
    environment:
      - CI_ENVIRONMENT=development
      # MinIO configuration used by the webapp (read by ConfigController::_initMinioClient())
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_REGION=us-east-1
      - MINIO_VERSION=latest
      - MINIO_USE_PATH_STYLE_ENDPOINT=true
      - MINIO_ACCESS_KEY_ID=admin
      - MINIO_SECRET_ACCESS_KEY=admin123
      - MINIO_BUCKET_RAW=lab01
      # ... (demais variáveis de ambiente)
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "vscode:host-gateway"
    networks:
      - airflow_net
    # Não precisa de 'command' se estiver usando imagem base PHP-Apache

  atlas:
    image: sburn/apache-atlas:latest
    container_name: apache-atlas
    ports:
      - "21000:21000"
    environment:
      - JAVA_OPTS=-Xmx1024m -Xms512m
      - ATLAS_SERVER_OPTS=-server -XX:SoftRefLRUPolicyMSPerMB=0 -XX:+CMSClassUnloadingEnabled -XX:+UseConcMarkSweepGC -XX:+CMSPermGenSweepingEnabled
    volumes:
      - atlas_data:/opt/atlas/data
      - atlas_logs:/opt/atlas/logs
    restart: unless-stopped
    mem_limit: 2g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - airflow_net

  pyspark-aula:
    build:
      context: ./atlas-lab
      dockerfile: Dockerfile_Spark
    container_name: pyspark_aula_container
    profiles:
      - atlas
    ports:
      - "8888:8888" # Jupyter Notebook
      - "4040:4040" # Spark UI
    volumes:
      - ./atlas-lab/notebooks:/home/jovyan/work
      - ./atlas-lab/data:/home/jovyan/data
      - ./atlas-lab/lab:/home/jovyan/lab
      - ./atlas-lab/meu-catalogo-atlas:/home/jovyan/meu-catalogo-atlas
    environment:
      - JUPYTER_TOKEN=tavares1234
      - SPARK_DRIVER_MEMORY=4g
      - SPARK_EXECUTOR_MEMORY=4g
    restart: always
    networks:
      - airflow_net
  

networks:
  airflow_net:
    driver: bridge

volumes:
  pg_data:
  mysql_data:
  atlas_data:
  atlas_logs:
  spark_metastore:
  spark_warehouse:
  spark_ivy:
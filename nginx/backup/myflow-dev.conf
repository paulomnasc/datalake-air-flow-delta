# Bloco para airflow na porta airflow (variável da porta)
server {
    listen 28083;
    server_name localhost;

    location / {
        proxy_pass http://airflow-webserver:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Servidor padrão - rejeita requisições sem Host correto
server {
    listen 80 default_server;
    server_name _;
    return 444; # Fecha conexão sem resposta
}

# VirtualHost HTTP (sempre presente)
server {
    listen 80;
    server_name localhost;
    
    # Se SSL habilitado, redireciona para HTTPS; se não, processa direto
    location / {
        proxy_pass http://codeigniter-app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


# VirtualHost HTTPS para produção
server {
    listen 28443 ssl;
    server_name myflow.estudotabela.com.br;

    # Certificados SSL
    ssl_certificate /etc/letsencrypt/live/myflow.estudotabela.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myflow.estudotabela.com.br/privkey.pem;
    
    # Configuração SSL segura
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Logs
    access_log /var/log/nginx/myflow_ssl_access.log;
    error_log /var/log/nginx/myflow_ssl_error.log;

    # Limite de tamanho para uploads
    client_max_body_size 200M;

    # Reverse proxy para webapp CodeIgniter
    location / {
        proxy_pass http://codeigniter-app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# Servidor padrão - rejeita requisições sem Host correto
server {
    listen 80 default_server;
    server_name _;
    return 444; # Fecha conexão sem resposta
}

# VirtualHost para myflow.estudotabela.com.br
server {
    listen 80;
    server_name myflow.estudotabela.com.br;

    # Logs
    access_log /var/log/nginx/myflow_access.log;
    error_log /var/log/nginx/myflow_error.log;

    # Reverse proxy para webapp CodeIgniter
    location / {
        proxy_pass http://codeigniter-app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# Servidor padrão - rejeita requisições sem Host correto
server {
    listen 80 default_server;
    server_name _;
    return 444; # Fecha conexão sem resposta
}

# Redireciona HTTP para HTTPS
server {
    listen 80;
    server_name myflow.estudotabela.com.br;
    return 301 https://$server_name$request_uri;
}

# VirtualHost HTTPS para myflow.estudotabela.com.br
server {
    listen 443 ssl http2;
    server_name myflow.estudotabela.com.br;

    # Certificados SSL
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    
    # Configuração SSL segura
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Logs
    access_log /var/log/nginx/myflow_access.log;
    error_log /var/log/nginx/myflow_error.log;

    # Reverse proxy para webapp CodeIgniter
    location / {
        proxy_pass http://codeigniter-app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

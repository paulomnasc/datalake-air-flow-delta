# spark-defaults.conf
# Configura o acesso ao MinIO como um endpoint S3
spark.hadoop.fs.s3a.endpoint              http://minio:9000
spark.hadoop.fs.s3a.access.key            admin
spark.hadoop.fs.s3a.secret.key            admin123
spark.hadoop.fs.s3a.path.style.access     true
spark.hadoop.fs.s3a.connection.ssl.enabled false
spark.sql.catalog.spark_catalog           org.apache.spark.sql.delta.catalog.DeltaCatalog

# Configurações do Hive Metastore
javax.jdo.option.ConnectionURL            jdbc:derby:;databaseName=/home/spark/metastore_db;create=true
spark.sql.warehouse.dir                   /home/spark/warehouse

# Configurações do Delta Lake - JARs compartilhados
spark.jars                                /home/spark/.ivy2/jars/io.delta_delta-core_2.12-2.4.0.jar,/home/spark/.ivy2/jars/io.delta_delta-storage-2.4.0.jar,/home/spark/.ivy2/jars/org.antlr_antlr4-runtime-4.9.3.jar
spark.driver.extraClassPath               /home/spark/.ivy2/jars/io.delta_delta-core_2.12-2.4.0.jar:/home/spark/.ivy2/jars/io.delta_delta-storage-2.4.0.jar:/home/spark/.ivy2/jars/org.antlr_antlr4-runtime-4.9.3.jar
spark.executor.extraClassPath             /home/spark/.ivy2/jars/io.delta_delta-core_2.12-2.4.0.jar:/home/spark/.ivy2/jars/io.delta_delta-storage-2.4.0.jar:/home/spark/.ivy2/jars/org.antlr_antlr4-runtime-4.9.3.jar
spark.sql.extensions                      io.delta.sql.DeltaSparkSessionExtension

# Configurações do Hive Metastore (Derby embedded)
spark.sql.warehouse.dir                   /opt/spark-apps/warehouse
javax.jdo.option.ConnectionURL            jdbc:derby:;databaseName=/opt/spark-apps/metastore_db;create=true
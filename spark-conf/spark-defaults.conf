# spark-defaults.conf
# Configura o acesso ao MinIO como um endpoint S3
spark.hadoop.fs.s3a.endpoint              http://minio:9000
spark.hadoop.fs.s3a.access.key            admin
spark.hadoop.fs.s3a.secret.key            admin123
spark.hadoop.fs.s3a.path.style.access     true
spark.hadoop.fs.s3a.connection.ssl.enabled false

# Delta Lake JARs - carregados diretamente
spark.jars                                /home/spark/.ivy2/jars/io.delta_delta-core_2.12-2.4.0.jar,/home/spark/.ivy2/jars/io.delta_delta-storage-2.4.0.jar,/home/spark/.ivy2/jars/org.apache.hadoop_hadoop-aws-3.3.4.jar,/home/spark/.ivy2/jars/com.amazonaws_aws-java-sdk-bundle-1.12.262.jar

# Adicionar JARs ao classpath do Driver e Executor
spark.driver.extraClassPath               /home/spark/.ivy2/jars/io.delta_delta-core_2.12-2.4.0.jar:/home/spark/.ivy2/jars/io.delta_delta-storage-2.4.0.jar:/home/spark/.ivy2/jars/org.apache.hadoop_hadoop-aws-3.3.4.jar:/home/spark/.ivy2/jars/com.amazonaws_aws-java-sdk-bundle-1.12.262.jar
spark.executor.extraClassPath             /home/spark/.ivy2/jars/io.delta_delta-core_2.12-2.4.0.jar:/home/spark/.ivy2/jars/io.delta_delta-storage-2.4.0.jar:/home/spark/.ivy2/jars/org.apache.hadoop_hadoop-aws-3.3.4.jar:/home/spark/.ivy2/jars/com.amazonaws_aws-java-sdk-bundle-1.12.262.jar

# Delta Lake configurations
spark.sql.extensions                      io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog           org.apache.spark.sql.delta.catalog.DeltaCatalog

# Garante que o S3A FileSystem está configurado
spark.hadoop.fs.s3a.impl                  org.apache.hadoop.fs.s3a.S3AFileSystem

# Baixa e disponibiliza os jars via Maven (evita dependência de arquivos já existentes no Ivy)
spark.jars.packages                       io.delta:delta-core_2.12:2.4.0,io.delta:delta-storage:2.4.0,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262

# Configurações de memória para ambiente com 20GB RAM
spark.driver.memory                       2g
spark.executor.memory                     2g
spark.sql.thriftServer.incrementalCollect true
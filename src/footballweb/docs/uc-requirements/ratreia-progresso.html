<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo do Curso - Tracking Ativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 12px; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Cabeçalho do Módulo -->
        <div class="mb-6">
            <span class="text-blue-400 text-sm font-bold uppercase tracking-widest">Módulo 1</span>
            <h1 class="text-3xl font-bold mt-1">Introdução ao Ecossistema de Dados</h1>
        </div>

        <!-- Player de Vídeo -->
        <div class="video-container shadow-2xl border border-slate-700">
            <div id="player"></div>
        </div>

        <!-- Status de Tracking (Simulação para o Admin) -->
        <div class="mt-8 bg-slate-800 p-6 rounded-xl border border-slate-700">
            <h3 class="text-lg font-semibold mb-4 flex items-center gap-2">
                <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
                Status de Monitoramento (Server-side)
            </h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
                <div class="p-3 bg-slate-900 rounded-lg">
                    <p class="text-slate-400">Tempo Atual</p>
                    <p id="current-time" class="font-mono text-xl">00:00</p>
                </div>
                <div class="p-3 bg-slate-900 rounded-lg">
                    <p class="text-slate-400">Progresso</p>
                    <p id="progress-percent" class="font-mono text-xl">0%</p>
                </div>
                <div class="p-3 bg-slate-900 rounded-lg">
                    <p class="text-slate-400">Status</p>
                    <p id="player-status" class="font-mono text-xl text-yellow-500">Aguardando</p>
                </div>
                <div class="p-3 bg-slate-900 rounded-lg">
                    <p class="text-slate-400">Concluído</p>
                    <p id="is-finished" class="font-mono text-xl text-red-500">Não</p>
                </div>
            </div>
            <p class="mt-4 text-xs text-slate-500 italic">
                * Estes dados são enviados via POST para sua rota `/api/video-progress` automaticamente.
            </p>
        </div>
    </div>

    <script>
        // 1. Carrega a API do YouTube
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var progressInterval;
        const videoId = '6073YAGEq08'; // Aula 1 do seu CSV
        const milestoneStep = 5;
        const trackContext = {
            userId: 'ID_DO_USER_LOGADO',
            courseId: 'curso-001',
            lessonId: 'aula-001'
        };
        var lastSentPercent = -1;
        var lastSentAt = 0;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '360',
                width: '640',
                videoId: videoId,
                playerVars: {
                    'rel': 0,
                    'modestbranding': 1
                },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            const statusEl = document.getElementById('player-status');
            
            if (event.data == YT.PlayerState.PLAYING) {
                statusEl.innerText = "Assistindo";
                statusEl.className = "font-mono text-xl text-green-500";
                startTracking();
            } else if (event.data == YT.PlayerState.PAUSED) {
                statusEl.innerText = "Pausado";
                statusEl.className = "font-mono text-xl text-yellow-500";
                stopTracking();
            } else if (event.data == YT.PlayerState.ENDED) {
                statusEl.innerText = "Finalizado";
                document.getElementById('is-finished').innerText = "Sim";
                document.getElementById('is-finished').className = "font-mono text-xl text-green-500";
                saveProgress(100, true);
                stopTracking();
            }
        }

        function startTracking() {
            stopTracking();
            progressInterval = setInterval(() => {
                let currentTime = player.getCurrentTime();
                let duration = player.getDuration();
                if (!duration || duration <= 0) {
                    return;
                }

                let percent = ((currentTime / duration) * 100);
                let percentFixed = percent.toFixed(2);
                let percentInt = Math.floor(percent);

                document.getElementById('current-time').innerText = formatTime(currentTime);
                document.getElementById('progress-percent').innerText = percentFixed + "%";

                // Envia para o backend apenas em marcos e sem repetir o mesmo percentual
                if (shouldSendProgress(percentInt)) {
                    saveProgress(percentFixed, false);
                }
            }, 1000);
        }

        function stopTracking() {
            if (progressInterval) {
                clearInterval(progressInterval);
            }
        }

        function formatTime(time) {
            time = Math.round(time);
            var minutes = Math.floor(time / 60);
            var seconds = time - minutes * 60;
            return minutes + ":" + (seconds < 10 ? '0' : '') + seconds;
        }

        // FUNÇÃO CRUCIAL: Envia os dados para o seu banco de dados
        function saveProgress(percent, finished) {
            console.log(`Enviando progresso: ${percent}% | Concluido: ${finished}`);

            var payload = {
                user_id: trackContext.userId,
                course_id: trackContext.courseId,
                lesson_id: trackContext.lessonId,
                video_id: videoId,
                percent: Number(percent),
                completed: finished,
                timestamp: new Date().toISOString()
            };

            postWithRetry('/api/video-progress', payload, 2, 800);
        }

        function shouldSendProgress(percentInt) {
            if (percentInt <= 0 || percentInt >= 100) {
                return false;
            }

            var now = Date.now();
            var isMilestone = percentInt % milestoneStep === 0;
            var isNew = percentInt !== lastSentPercent;
            var isThrottled = (now - lastSentAt) < 2000;

            if (isMilestone && isNew && !isThrottled) {
                lastSentPercent = percentInt;
                lastSentAt = now;
                return true;
            }

            return false;
        }

        function postWithRetry(url, payload, retries, baseDelayMs) {
            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            }).catch(function () {
                if (retries > 0) {
                    var delay = baseDelayMs * (3 - retries);
                    setTimeout(function () {
                        postWithRetry(url, payload, retries - 1, baseDelayMs);
                    }, delay);
                }
            });
        }
    </script>
</body>
</html>
